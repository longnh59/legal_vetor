services:
  vbpl-postgres:
    image: pgvector/pgvector:pg16
    container_name: vbpl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vbpl
      POSTGRES_USER: vbpl
      POSTGRES_PASSWORD: vbpl_dev
    ports:
      - "5433:5432"
    volumes:
      - vbpl_postgres_data:/var/lib/postgresql/data
      - ./files/schema_postgres.sql:/docker-entrypoint-initdb.d/001_schema_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbpl -d vbpl"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vbpl_postgres_data:
