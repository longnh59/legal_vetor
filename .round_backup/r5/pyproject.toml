[project]
name = "vbpl-crawler"
version = "2.0.0"
description = "Crawler and release tooling for the Vietnamese Legal Documents dataset"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20",
    "pyarrow>=18",
    "scrapy>=2.13",
]

[project.optional-dependencies]
validation = [
    "datasets>=4",
    "huggingface-hub>=0.30",
]

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
